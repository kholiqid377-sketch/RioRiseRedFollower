name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p buildsrc

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP project tidak ditemukan."
            exit 1
          fi

          echo "Menggunakan ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc

      - name: Configure AndroidX
        shell: bash
        run: |
          GRADLEW=$(find buildsrc -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project ditemukan di: $PROJECT_DIR"

          touch "$PROJECT_DIR/gradle.properties"

          grep -qxF "android.useAndroidX=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

          grep -qxF "android.enableJetifier=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

          echo "gradle.properties:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        shell: bash
        run: |
          GRADLEW=$(find buildsrc -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            buildsrc/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
