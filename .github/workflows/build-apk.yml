name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p buildsrc
          unzip -q RioRiseRedFollower*.zip -d buildsrc

      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> buildsrc/riorise/gradle.properties
          echo "android.enableJetifier=true" >> buildsrc/riorise/gradle.properties

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: buildsrc/riorise
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RioRiseRedFollower-debug
          path: buildsrc/riorise/app/build/outputs/apk/debug/*.apk
